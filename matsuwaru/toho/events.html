<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1c2e">
<title>イベント傾向｜全台系まつわるチェッカー</title>
<meta name="description" content="マルハン新宿東宝ビル店のイベント別の機種傾向と、今月の実施状況。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,
           "Segoe UI","Noto Sans JP",sans-serif;
  --bg:#0d1c2e; --panel:#16283f; --bg-soft:#1e3049;
  --ink:#e6f0fa; --sub:#93aac4; --line:#2c4560;
  --accent:#3b82f6; --accent-soft:rgba(59,130,246,.22);
  --hot:#f43f5e; --warm:#eab308;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);
  line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
.top{position:sticky;top:0;z-index:20;background:rgba(13,28,46,.94);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 14px) 20px 12px}
.site{display:flex;align-items:center;gap:6px;margin:0 0 3px;text-decoration:none}
.site span{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em}
.site .mk{width:11px;height:18px;flex:0 0 auto;display:block;color:var(--sub)}
.ttl{font-size:18px;margin:0 0 12px;letter-spacing:.02em;line-height:1.35}
.badge{display:inline-block;font-size:10.5px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:3px 9px;margin-left:8px;vertical-align:2px}
.back{display:inline-block;font-size:13px;color:var(--accent);text-decoration:none}
main{max-width:680px;margin:0 auto;padding:18px 20px 60px}
h2{font-size:13px;color:var(--sub);margin:28px 0 10px;font-weight:700;letter-spacing:.04em}
h2:first-of-type{margin-top:4px}
.card{border:1px solid var(--line);border-radius:16px;background:var(--panel);
  padding:15px 16px;margin-bottom:11px}
.dhd{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.dhd b{font-size:16px}
.dhd .tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);flex:0 0 auto;white-space:nowrap}
.ov{font-size:12.5px;color:var(--sub);margin:8px 0 0;line-height:1.75}
.sec{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.06em;margin:14px 0 8px}
.sizeb{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 10px}
.sizeb .sr{display:contents}
.sizeb .sl{font-size:12px;color:var(--ink);white-space:nowrap}
.sizeb .sl i{font-style:normal;color:var(--sub);font-size:10.5px;margin-left:4px}
.sizeb .bar{height:7px;border-radius:99px;background:var(--bg-soft);overflow:hidden}
.sizeb .bar u{display:block;height:100%;background:var(--accent);text-decoration:none}
.sizeb .sv{font-size:12px;font-weight:700;text-align:right;white-space:nowrap;
  font-variant-numeric:tabular-nums}
.sizeb .sv em.cnt{font-weight:400;font-size:10.5px;color:var(--sub);margin:0 6px 0 0}
.sizeb .sv em{font-style:normal;font-weight:700;font-size:10.5px;margin-left:4px}
.sizeb .sv em.up{color:#4ade80}
.sizeb .sv em.dn{color:var(--sub)}
.sizeb .sub2{color:var(--sub);opacity:.75}
.evname{font-size:13px;color:var(--ink);margin:0 0 9px}
.evname i{font-style:normal;color:var(--sub)}
.ms{display:flex;flex-wrap:wrap;gap:6px}
.m{display:inline-flex;align-items:baseline;gap:5px;background:var(--bg-soft);
  border-radius:999px;padding:5px 11px;font-size:13px;white-space:nowrap}
.m em{font-style:normal;font-size:11px;color:var(--sub)}
.m b{font-weight:700;font-variant-numeric:tabular-nums}
.m i{font-style:normal;font-size:10.5px;font-weight:700;margin-right:6px;
  padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.14);color:var(--ink)}
.m.r1{background:rgba(234,179,8,.18)}
.m.r1 i{background:#eab308;color:#0d1c2e}
.m.r1 em{color:#f5d97a}
.m.r2{background:rgba(203,213,225,.13)}
.m.r2 i{background:#cbd5e1;color:#0d1c2e}
.m.r2 em{color:#cbd5e1}
.m.r3{background:rgba(217,119,6,.16)}
.m.r3 i{background:#d97706;color:#fff}
.m.r3 em{color:#e0a76a}
.m.mid{background:rgba(234,179,8,.14)}
.m.mid em{color:var(--warm)}
.pickbox{position:relative;margin:0 0 14px}
.pickbox select{width:100%;font:inherit;font-size:15px;padding:14px 42px 14px 16px;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);
  appearance:none;-webkit-appearance:none;outline:none;cursor:pointer}
.pickbox select:focus{border-color:var(--accent)}
.pickbox::after{content:'▾';position:absolute;right:16px;top:50%;transform:translateY(-50%);
  color:var(--sub);pointer-events:none;font-size:15px}
.detail .dhd{margin-bottom:8px}
.notyet{border:1px solid rgba(244,63,94,.45);background:rgba(244,63,94,.07);
  border-radius:12px;padding:11px 13px;margin-bottom:8px}
.notyet:last-child{margin-bottom:0}
.notyet .rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.notyet .rh b{font-size:14px;color:#ffd4dc}
.notyet .rh span{font-size:11px;color:var(--hot);white-space:nowrap;font-weight:700}
.rowlist{border:1px solid var(--line);border-radius:16px;background:var(--panel);overflow:hidden}
.row{display:block;padding:12px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .rh{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px}
.row .rh b{font-size:14px}
.row .rh span{font-size:11px;color:var(--sub);white-space:nowrap}
.note{font-size:11.5px;color:var(--sub);line-height:1.7;margin:0 0 14px}
.dates{font-size:11px;color:var(--sub);margin:6px 0 0}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11px;color:var(--sub);line-height:1.8}
.foot a{color:var(--accent)}
</style>
</head>
<body>

<div class="top">
  <a class="site" href="/">
    <svg class="mk" viewBox="0 0 60 96" aria-hidden="true">
      <g transform="translate(30,48)">
        <g transform="translate(0,-34) rotate(-8)" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round">
          <path d="M -26 6 A 26 10 0 0 0 26 6"></path>
          <line x1="-26" y1="0" x2="-26" y2="6"></line>
          <line x1="26" y1="0" x2="26" y2="6"></line>
          <ellipse rx="26" ry="10"></ellipse>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
          <ellipse rx="22" ry="8"></ellipse>
          <line x1="-22" y1="0" x2="-22" y2="5"></line><line x1="22" y1="0" x2="22" y2="5"></line>
          <path d="M -22 5 A 22 8 0 0 0 22 5"></path>
          <line x1="-24" y1="5" x2="-24" y2="12"></line><line x1="20" y1="5" x2="20" y2="12"></line>
          <path d="M -24 12 A 22 8 0 0 0 20 12"></path>
        </g>
      </g>
    </svg>
    <span>みんなのスロット</span>
  </a>
  <h1 class="ttl">イベント傾向<span class="badge">マルハン東宝</span></h1>
  <a class="back" href="./">← 示唆から検索する</a>
</div>

<main id="main"><p class="note">読み込み中…</p></main>

<script>
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

fetch('data/events.json').then(r=>r.json()).then(render).catch(()=>{
  document.getElementById('main').innerHTML='<p class="note">データを読み込めませんでした。</p>';
});

// 回数の多い順に順位を付ける。同じ回数なら同じ順位にする
// （22%が5機種並ぶような場面で、順位だけ違うと誤解を招くため）
function ranked(top){
  let rank = 0, prev = null;
  return top.map((r,i)=>{ if(r[1] !== prev){ rank = i+1; prev = r[1]; } return [r, rank]; });
}
// 機種名 → 過去○/▲回 → ％ の順。分母がないと％の重みが伝わらないため
function mchip([m,k,rate,mul], rank, days){
  const cls = rank<=3 ? ' r'+rank : '';
  const badge = rank<=3 ? `<i>${rank}位</i>` : '';
  return `<span class="m${cls}">${badge}${esc(m)}<em>過去${k}/${days}回</em><b>${rate}%</b></span>`;
}
const chips = (top, rank=true, days=0) =>
  ranked(top).map(([r,n])=>mchip(r, rank?n:99, days)).join('');


let DB=null, picked=null;

const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
                  + '-' + String(d.getDate()).padStart(2,'0');
// 店長ポストで判明した日は、日付ルールより優先する
const override = d => (DB && DB.schedule) ? DB.schedule[ymd(d)] : null;

// その日に当てはまるイベントかどうか
function applies(p, d){
  const ov = override(d);
  if(ov) return ov.includes(p.key);
  const m = p.match, day = d.getDate();
  if(m.digit) return m.digit.includes(day%10);
  if(m.day) return m.day.includes(day);
  if(m.monthend) return new Date(d.getFullYear(), d.getMonth()+1, 0).getDate() === day;
  if(m.irregular) return false;   // 不定期は日付から判定できない
  return false;
}
const fullLabel = p => p.label + (p.sub ? '（' + p.sub + '）' : '');

// 傾向の文章。①多台数の実態 ②中台数との関係 ③系統 ④結論 の順に組み立てる
// この店は「まつわる」で決まる。日付の数字は機種名だけでなく台数にも掛かるので、
// そこが効いている日はいちばん先に言う
function numText(p){
  const t = p.numTie;
  if (!t || t.days / p.days < 0.5) return '';
  const who = t.top.map(([m, r, k]) => `${m}${r === '名前' ? '' : ' ' + r}が${k}回`).join('、');
  const head = t.days === p.days
    ? `${t.digit}にまつわる機種が、これまでの開催すべてで入っています。`
    : `${t.digit}にまつわる機種が${t.days}/${p.days}回で入っています。`;
  return head + (who ? who + '。' : '');
}

function sizeText(z, all, p, D){
  const out = [], n = z.n;
  const names = (p.bigList||[]).map(x=>`${x[0]} ${x[1]}台${x[2]>1?`（${x[2]}回）`:''}`).join('・');

  // ① 系統。まず「どの系統の機種が来る日か」を言う
  const gAll = Object.fromEntries((D.groupsAll||[]).map(([g,k])=>[g, k/D.sizeAll.n*100]));
  const gs = (p.groups||[]).map(([g,k])=>({g, k, d: k/n*100 - (gAll[g]||0)}))
                           .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  // 開催2回以下では「全開催で入る」も偶然なので系統には触れない
  const few = p.days < 3;
  const ups = few ? [] : gs.filter(x=>x.d >= 10).slice(0, 2).sort((a,b)=>b.k-a.k);
  const dn = few ? null : gs.find(x=>x.d <= -20);
  const up = ups[0];
  if(ups.length === 1)
    out.push(up.k === n ? `系統では${up.g}が${up.k}/${n}回と、全開催で入っています。`
                        : `系統では${up.g}が${up.k}/${n}回と目立ちます。`);
  else if(ups.length === 2)
    out.push(ups[0].k === n
      ? `系統では${ups[0].g}が全開催で入り、${ups[1].g}も${ups[1].k}/${n}回と目立ちます。`
      : `系統では${ups[0].g}が${ups[0].k}/${n}回、${ups[1].g}が${ups[1].k}/${n}回と目立ちます。`);
  if(dn) out.push(ups.length ? `逆に${dn.g}は${dn.k}/${n}回と少なめです。`
                             : `系統では${dn.g}が${dn.k}/${n}回と少なめです。`);

  // ② 数字まつわり
  const nt = numText(p);
  if(nt) out.push(nt);

  // ③ 台数
  const dB = z.big - all.big;
  if(z.bigN === 0)
    out.push(n === 1 ? '多台数（20台以上）は入っていません。'
                     : `多台数（20台以上）は、${n}回とも一度も選ばれていません。`);
  else if(z.big === 100)
    out.push(`これまでの開催すべてで多台数（20台以上）が選ばれています。${names?'入ったのは'+names+'。':''}`);
  else if(z.bigN <= 3 || dB <= -15)
    out.push(`多台数（20台以上）は${n}回中${z.bigN}回だけです。${names?'入ったのは'+names+'。':''}`);
  else if(dB >= 15)
    out.push(`多台数（20台以上）が${z.bigN}/${n}回と、他の日より選ばれやすい日です。${names?'入ったのは'+names+'。':''}`);
  else
    out.push(`多台数（20台以上）は${z.bigN}/${n}回で、全体と近い出方です。`);

  if(p.midFills)
    out.push(`中台数（10〜19台）は${z.midN}/${n}回。入らなかった日はすべて多台数が入った日で、どちらかの規模がほぼ毎回選ばれます。`);
  else if(z.mid - all.mid >= 15)
    out.push(`中台数（10〜19台）は${z.midN}/${n}回と多めです。`);
  else if(z.mid - all.mid <= -15)
    out.push(`中台数（10〜19台）は${z.midN}/${n}回と少なめです。`);

  const nm = p.norm, na = D.normAll;
  if(nm && na && Math.abs(nm.pct - na.pct) >= 10)
    out.push(nm.pct > na.pct
      ? `選ばれた機種の${nm.pct}%がノーマルAタイプで、全体（${na.pct}%）より多めです。`
      : `選ばれた機種のうちノーマルAタイプは${nm.pct}%で、全体（${na.pct}%）より少なめです。`);

  const vr = p.vari, va = D.variAll;
  if(vr && va && p.days >= 5 && Math.abs(vr.pct - va.pct) >= 8)
    out.push(vr.pct > va.pct
      ? `1台構成のバラエティ機種が${vr.pct}%と、全体（${va.pct}%）より多めです。`
      : `1台構成のバラエティ機種は${vr.pct}%で、全体（${va.pct}%）より少なめです。`);

  // ④ 結論。まつわりが効いている日は系統がその副産物なので、系統は出さない
  const t = p.numTie, strongNum = t && t.days / p.days >= 0.7;
  const band = z.bigN === 0 ? null
             : (z.big >= 70 ? '多台数' : (z.midN >= z.bigN && z.mid - all.mid >= 10 ? '中台数' : null));
  const key = [];
  if(strongNum) key.push(`${t.digit}まつわり`);
  if(!strongNum && up) key.push(up.g + '系');
  if(band) key.push(band + '規模');
  if(key.length) out.push(`${key.join('と')}の示唆を拾えるかが鍵になります。`);
  else if(z.bigN === 0) out.push('小さめの島を中心に示唆を追うことになります。');

  // ⑤ おまけ
  const dp = z.perDay - all.perDay;
  if(dp >= 2)         out.push(`1日に選ばれる機種数も多く、平均${z.perDay}機種です。`);
  else if(dp <= -1.5) out.push(`1日に選ばれる機種数は少なめで、平均${z.perDay}機種です。`);
  return out.join('');
}

// 台数の傾向。全体との差で読むもの（全系の8割は9台以下なので、割合そのものは効かない）
function sizeBlock(z, all, p, D){
  if(!z) return '';
  const row = (name, note, v, base, k) => {
    const d = v - base;
    const delta = d === 0 ? '' : `<em class="${d>0?'up':'dn'}">${d>0?'+':''}${d}</em>`;
    return `<div class="sr"><span class="sl">${name}<i>${note}</i></span>
      <span class="bar"><u style="width:${Math.max(v,1)}%"></u></span>
      <span class="sv"><em class="cnt">${k}/${z.n}回</em>${v}%${delta}</span></div>`;
  };
  return `<div class="sec">傾向</div><p class="ov">${sizeText(z, all, p, D)}</p>
  <div class="sizeb">
    ${row('多台数','20台〜', z.big, all.big, z.bigN)}
    ${row('中台数','10〜19台', z.mid, all.mid, z.midN)}
    ${row('小台数','4〜9台', z.small, all.small, z.smallN)}
    ${row('3台以下','', z.tiny, all.tiny, z.tinyN)}
  </div>
  <p class="dates">${p.numTie ? 'まつわりは、機種名にその数字が入るか、台数の末尾がその数字のものです。<br>' : ''}開催${z.n}回のうち、その台数帯が1機種でも選ばれた回数です。台数は実施当日の記録です。<br>
    1日あたり${z.perDay}機種／選ばれた機種の平均${z.avg}台
    <span class="sub2">（全体は${all.perDay}機種・${all.avg}台）</span></p>`;
}

function detail(p){
  const ms = p.top.length
    ? `<div class="ms">${chips(p.top, !p.small, p.days)}</div>`
    : '<p class="note" style="margin:0">実績がまだありません。</p>';
  const irr = p.g === '不定期イベント';
  const dates = irr && p.dates
    ? `<p class="dates">開催日：${p.dates.map(d=>d.slice(5).replace('-','/')).join('・')}</p>` : '';
  const warn = p.small ? '<p class="dates">※開催回数が少なく、傾向とまでは言えません。</p>' : '';
  const note = p.note ? `<p class="ov">${esc(p.note)}</p>` : '';
  return `<div class="card detail">
    <div class="dhd"><b>${esc(fullLabel(p))}</b><span class="tag">過去${p.days}${irr?'回':'日'}</span></div>
    ${note}<div class="sec">選ばれた機種</div>${ms}${dates}${warn}
    ${sizeBlock(p.size, DB.sizeAll, p, DB)}</div>`;
}

function drawPicked(){
  const cur = DB.events.find(x=>x.key===picked) || DB.events[0];
  document.getElementById('detail').innerHTML = detail(cur);
}

function render(D){
  DB = D;
  // 示唆のポストは20:30ごろ。それ以降は翌営業日が対象になり、
  // 日付をまたぐと同じ日が「今日」に変わる（対象の日は変わらない）
  const now = new Date();
  const afterPost = now.getHours()*60 + now.getMinutes() >= 20*60 + 30;
  const target = new Date(now);
  if (afterPost) target.setDate(target.getDate() + 1);
  const when = afterPost ? '明日' : '今日';
  let h = '';

  // 対象日に当てはまるものを最初から選んでおく
  const hit = D.events.find(p=>applies(p,target));
  picked = (hit || D.events[0]).key;
  // 端末標準の選択（縦にスクロールできる）を使う
  const grp = (name, items) => items.length
    ? `<optgroup label="${name}">` + items.map(p=>
        `<option value="${esc(p.key)}"${p.key===picked?' selected':''}>${applies(p,target)?'● ':''}${esc(fullLabel(p))}</option>`
      ).join('') + `</optgroup>` : '';
  h += `<h2>イベントを選ぶ</h2>`;
  h += `<div class="pickbox"><select id="picker" aria-label="イベントを選ぶ">`
     + [...new Set(D.events.map(p=>p.g))].map(g=>grp(g, D.events.filter(p=>p.g===g))).join('')
     + `</select></div>`;
  h += `<div id="detail"></div>`;
  h += `<p class="note">そのイベントの日のうち、何回・何割で全系になったかです。過去${D.totalDays}日ぶんの実績から出しています。同じ日に複数当てはまる場合は、細かいほうのイベントだけを数えています。取材などの不定期イベントが入った日と、21-27WEEK・月末最終日にあたる日は、◯のつく日の集計には含めていません。</p>`;

  const t = D.thisMonth;
  h += `<h2>${t.month.replace('-','年')}月の実施状況</h2>`;
  h += `<div class="card"><b>実施済み ${t.done.length}機種</b>
     <div class="ms" style="margin-top:8px">${t.done.map(([m,n])=>`<span class="m">${esc(m)}<em>${n}回</em></span>`).join('')}</div></div>`;
  if(t.notYet.length){
    h += `<div class="card"><b>今月未実施の機種</b><div style="margin-top:10px">`;
    h += t.notYet.slice(0,20).map(([m,avg,sd,gap,last])=>{
      const steady = avg && sd && sd < avg*0.6;
      return `<div class="notyet"><div class="rh"><b>${esc(m)}</b>
        <span>${last.slice(5).replace('-','/')}から${gap}日</span></div>
        <span class="m${steady?' mid':''}" style="font-size:12px">平均${avg}日おき<em>ばらつき±${sd}日${steady?' 安定':''}</em></span></div>`;
    }).join('') + `</div></div>`;
    const lu = t.lineup ? `現在の設置機種${t.lineup.machines}機種（${t.lineup.fetched}時点・毎週の入れ替え後に更新）と照らし合わせ、撤去済みの機種は除いています。` : '';
    h += `<p class="note">間隔のばらつきが大きい機種が多く、厳密なローテーションではありません。「まだ来ていない＝次に来る」ではない点にご注意ください。ばらつきが小さい機種ほど、経過日数が参考になります。${lu}</p>`;
  }

  h += `<div class="foot">出典：<a href="https://sloslo-blog.hatenablog.com/" target="_blank" rel="noopener">マルハン新宿東宝ビルの追っかけブログ</a><br>
    集計は実際に全台系が行われた日で行っています。<br>最終更新 ${D.generated}</div>`;
  document.getElementById('main').innerHTML = h;
  drawPicked();
  document.getElementById('picker').addEventListener('change', e=>{
    picked = e.target.value; drawPicked();
  });
}
</script>
