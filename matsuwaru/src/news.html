<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お知らせ｜{{TITLE}}</title>
<style>
  :root{
    --bg:#0d1c2e; --panel:#16283f; --panel2:#1e3049; --line:#2c4560;
    --text:#e6f0fa; --muted:#93aac4;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.9;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:520px;margin:0 auto;padding:28px 18px 60px}
  .back{
    display:inline-block;font-size:12.5px;color:var(--muted);
    text-decoration:none;margin-bottom:18px;
  }
  h1{font-size:19px;line-height:1.5;margin:0 0 20px;letter-spacing:.02em}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:15px 15px 13px;margin-bottom:14px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
  .tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.05em;padding:4px 9px;border-radius:6px}
  .tag.fix{background:rgba(226,69,60,.16);color:#ff9c94}
  .tag.feat{background:rgba(47,181,106,.18);color:#6fe0a4}
  .date{font-size:11px;color:var(--muted)}
  .title{font-size:14.5px;font-weight:700;margin:0 0 8px;color:var(--text)}
  .lede{font-size:12.5px;color:#c3d2e6;margin:0 0 9px}
  ul{margin:0;padding-left:1.15em}
  li{font-size:12.5px;color:#c3d2e6;margin-bottom:5px}
</style>

<div class="wrap">
<a class="back" href="./">← {{TITLE}}</a>
<h1>お知らせ</h1>

<div class="card">
  <div class="row">
    <span class="tag feat">追加</span>
    <span class="date">2026年9月6日</span>
  </div>
  <div class="title">イベント傾向チェッカーに「日付ごとの全系実施機種」を追加しました</div>
  <p class="lede">月間の実施状況ページを見やすくしました。</p>
  <ul>
    <li>「日付ごとの全系実施機種」を新設。新しい日付順に、その日実施した機種と当日の稼働台数が並びます</li>
    <li>機種は現在の設置台数が多い順に並びます</li>
    <li>「実施済み」の機種一覧をタップで開閉できるようにしました</li>
  </ul>
</div>

</div>
