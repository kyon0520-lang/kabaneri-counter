<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d1c2e">
<title>全台系まつわるチェッカー｜みんなのスロット</title>
<meta name="description" content="店長ポストの示唆から、過去に全台系になった機種を逆引きします。店舗を選んでください。">
<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,
           "Segoe UI","Noto Sans JP",sans-serif;
  --bg:#0d1c2e; --panel:#16283f; --ink:#e6f0fa; --sub:#93aac4;
  --line:#2c4560; --accent:#3b82f6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);line-height:1.6;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 26px) 16px 60px}
.site{display:flex;align-items:center;gap:6px;margin:0 0 3px;text-decoration:none}
.site span{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.08em}
.site .mk{width:11px;height:18px;flex:0 0 auto;display:block;color:var(--sub)}
h1{font-size:19px;margin:0 0 6px;letter-spacing:.02em}
.lede{margin:0 0 26px;font-size:13px;color:var(--sub)}
.hintlabel{font-size:12px;color:var(--sub);margin:0 0 9px}
.store{display:block;border:1px solid var(--line);border-radius:16px;background:var(--panel);
  padding:16px 17px;margin-bottom:11px;text-decoration:none;transition:border-color .13s}
.store:hover{border-color:var(--accent)}
.store .nm{display:block;font-size:16px;font-weight:700;color:var(--ink)}
.store .sub{display:block;font-size:12px;color:var(--sub);margin-top:2px}
.foot{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);
  font-size:11px;color:var(--sub);line-height:1.8}
.foot a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <a class="site" href="/">
    <svg class="mk" viewBox="0 0 60 96" aria-hidden="true">
      <g transform="translate(30,48)">
        <g transform="translate(0,-34) rotate(-8)" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round">
          <path d="M -26 6 A 26 10 0 0 0 26 6"></path>
          <line x1="-26" y1="0" x2="-26" y2="6"></line>
          <line x1="26" y1="0" x2="26" y2="6"></line>
          <ellipse rx="26" ry="10"></ellipse>
        </g>
        <g fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round">
          <ellipse rx="22" ry="8"></ellipse>
          <line x1="-22" y1="0" x2="-22" y2="5"></line><line x1="22" y1="0" x2="22" y2="5"></line>
          <path d="M -22 5 A 22 8 0 0 0 22 5"></path>
          <line x1="-24" y1="5" x2="-24" y2="12"></line><line x1="20" y1="5" x2="20" y2="12"></line>
          <path d="M -24 12 A 22 8 0 0 0 20 12"></path>
        </g>
      </g>
    </svg>
    <span>みんなのスロット</span>
  </a>
  <h1>全台系まつわるチェッカー</h1>
  <p class="lede">店長ポストの示唆から、過去に全台系になった機種を引きます。</p>
  <p class="hintlabel">店舗を選んでください</p>
{{CARDS}}
  <div class="foot">
    各ページのデータは、その店舗を追っているブログの記事をもとに作成しています。
    出典と元記事へのリンクは各ページに記載しています。
  </div>
</div>
<script>
// 店舗別に分ける前、/matsuwaru/ に登録された Service Worker とキャッシュを消す。
// 残っていると古いページが出続けるため。
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => {
    rs.forEach(r => { if (r.scope.endsWith('/matsuwaru/')) r.unregister(); });
  }).catch(()=>{});
  if (window.caches) caches.keys().then(ks => ks.forEach(k => { if (k === 'matsuwaru-v1' || k === 'matsuwaru-v2') caches.delete(k); })).catch(()=>{});
}
</script>
</body>
</html>
