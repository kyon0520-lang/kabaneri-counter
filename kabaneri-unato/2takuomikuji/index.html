<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>カバネリチャレンジおみくじ</title>
<meta name="description" content="カバネリチャレンジの２択をサポートするアプリです。無名か生駒を選んでおみくじをタップしてください。">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="みんなのスロット">
<meta property="og:title" content="カバネリチャレンジおみくじ">
<meta property="og:description" content="カバネリチャレンジの２択をサポートするアプリです。無名か生駒を選んでおみくじをタップしてください。">
<meta property="og:url" content="https://minnanoslot.com/kabaneri-unato/2takuomikuji/">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="カバネリチャレンジおみくじ">
<meta name="twitter:description" content="カバネリチャレンジの２択をサポートするアプリです。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
  :root{
    --bg: #14100d;
    --bg-frame: #0c0a08;
    --surface: #1d1712;
    --surface-2: #241c15;
    --surface-3: #2b2118;
    --line: rgba(201,162,75,0.18);
    --line-strong: rgba(201,162,75,0.32);
    --ink: #ede3d3;
    --ink-dim: #b0a288;
    --ink-faint: #7c7160;
    --gold: #c9a24b;
    --gold-soft: #a8894a;
    --accent: #8a1f2b;
    --accent-soft: rgba(138,31,43,0.16);
    --good: #6b9b78;
    --good-bg: rgba(107,155,120,0.14);
    --bad: #b07a6a;
    --bad-bg: rgba(176,122,106,0.14);
    --shadow: 0 30px 60px -20px rgba(0,0,0,0.7);
    --serif: 'Shippori Mincho', 'Hiragino Mincho ProN', serif;
    --sans: 'Zen Kaku Gothic New', 'Hiragino Sans', sans-serif;
  }
  :root[data-persona="ikoma"]{
    --accent: #2f6e66;
    --accent-soft: rgba(47,110,102,0.16);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg-frame);
    color: var(--ink);
    font-family: var(--sans);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding: 8px;
  }

  .stage{
    width:100%;
    max-width:440px;
  }

  .phone-frame{
    position:relative;
    padding:10px;
    border-radius:28px;
    background-image: url("bg.jpg");
    background-size: cover;
    background-position: center;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.3);
  }

  .phone{
    position:relative;
    background: transparent;
    border-radius:22px;
    overflow:hidden;
    height: min(860px, calc(100dvh - 36px));
    display:flex;
    flex-direction:column;
  }
  .phone::before{
    content:"";
    position:absolute;
    inset:0;
    background: rgba(6,10,24,0.68);
    pointer-events:none;
    z-index:0;
  }
  .phone > header.top,
  .phone > nav.tabs,
  .phone > main,
  .phone > footer.note{
    position:relative;
    z-index:1;
  }

  /* faint ambient embers */
  .ember{
    position:absolute;
    border-radius:50%;
    background: var(--gold);
    opacity:0;
    pointer-events:none;
    filter: blur(0.5px);
    animation: drift 7s ease-in infinite;
  }
  @keyframes drift{
    0%{ transform:translateY(0); opacity:0; }
    10%{ opacity:0.55; }
    90%{ opacity:0.15; }
    100%{ transform:translateY(-160px); opacity:0; }
  }

  header.top{
    display:flex;
    align-items:center;
    gap:10px;
    padding:clamp(10px, 2.2dvh, 20px) 18px clamp(8px, 1.6dvh, 14px);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .crest{ width:34px; height:34px; flex-shrink:0; color: var(--gold); }
  .titles{ line-height:1.25; }
  .site-brand{
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:4px;
  }
  .site-brand-icon{ width:11px; height:17.5px; color: #f5f2ea; flex-shrink:0; display:block; }
  .site-brand span{
    font-family: var(--sans);
    font-size:11px;
    font-weight:700;
    letter-spacing:0.14em;
    color: #f5f2ea;
  }
  .titles .name{
    font-family: var(--serif);
    font-weight:800;
    font-size:19px;
    letter-spacing:0.02em;
  }
  .titles .sub{
    font-size:11px;
    color: var(--ink-faint);
    letter-spacing:0.04em;
    margin-top:2px;
  }

  nav.tabs{
    display:flex;
    gap:6px;
    padding:clamp(9px, 1.8dvh, 14px) 18px 0;
    flex-shrink:0;
  }
  nav.tabs button{
    flex:1;
    background: transparent;
    border:1px solid var(--line);
    color: var(--ink-dim);
    font-family: var(--sans);
    font-size:13px;
    font-weight:700;
    letter-spacing:0.04em;
    padding:8px 0;
    border-radius:10px;
    cursor:pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  nav.tabs button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  nav.tabs button[aria-selected="true"]{
    color: var(--ink);
    border-color: var(--line-strong);
    background: var(--surface-2);
  }

  main{
    flex:1;
    padding:clamp(12px, 2.5dvh, 22px) 18px clamp(10px, 2dvh, 26px);
    overflow-y:auto;
  }
  section[hidden]{ display:none !important; }

  /* --- Oracle tab --- */
  .persona-row{
    display:flex;
    gap:8px;
    margin-bottom:clamp(10px, 2dvh, 18px);
  }
  .persona-chip{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:7px 8px;
    border-radius:999px;
    border:1px solid var(--line);
    background: var(--surface);
    color: var(--ink-dim);
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    transition: border-color .15s ease, color .15s ease;
  }
  .persona-chip .dot{ width:7px; height:7px; border-radius:50%; background: var(--ink-faint); }

  .app-desc{
    text-align:center;
    font-size:clamp(12px, 2.2dvh, 12.5px);
    line-height:1.6;
    color: var(--ink-dim);
    max-width:34ch;
    margin:clamp(6px, 1.2dvh, 14px) auto 0;
  }
  .persona-chip[aria-pressed="true"]{ border-color: var(--accent); color: var(--ink); }
  .persona-chip[aria-pressed="true"] .dot{ background: var(--accent); }

  #panel-oracle{
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  #idleView{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
  }
  .tap-hint{
    margin:clamp(8px, 1.8dvh, 18px) 0 0;
    text-align:center;
    font-family: var(--serif);
    font-weight:800;
    font-size:clamp(17px, 3.5dvh, 23px);
    color: var(--gold);
    letter-spacing:0.04em;
    text-shadow: 0 0 14px rgba(201,162,75,0.55);
    animation: tap-pulse 1.7s ease-in-out infinite;
  }
  @keyframes tap-pulse{
    0%, 100%{ opacity:0.3; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.12); }
  }

  .today-line{
    text-align:center;
    font-size:clamp(11px, 2dvh, 12px);
    color: var(--ink-faint);
    letter-spacing:0.03em;
    margin-bottom:clamp(10px, 2dvh, 22px);
    font-variant-numeric: tabular-nums;
  }
  .today-line b{ color: var(--gold); font-weight:700; }

  .rune-wrap{
    display:flex;
    justify-content:center;
    margin: clamp(8px, 1.8dvh, 18px) 0 clamp(10px, 2dvh, 22px);
  }
  .rune-btn{
    position:relative;
    width:clamp(96px, 20dvh, 128px);
    padding:clamp(5px, 1dvh, 7px);
    border:none;
    border-radius:5px;
    background: linear-gradient(155deg, #b5222f, #8a1620);
    cursor:pointer;
    box-shadow: 0 18px 40px -18px rgba(0,0,0,0.8), 0 0 40px 5px rgba(255,190,100,0.35);
    transition: transform .15s ease;
  }
  .rune-btn::before{
    content:"";
    position:absolute;
    inset:-40px;
    z-index:-1;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,205,120,0.55) 0%, rgba(255,160,70,0.28) 38%, rgba(255,160,70,0) 72%);
    filter: blur(3px);
    animation: glow-pulse 2.6s ease-in-out infinite;
  }
  @keyframes glow-pulse{
    0%,100%{ opacity:0.65; transform:scale(0.94); }
    50%{ opacity:1; transform:scale(1.08); }
  }
  .rune-btn:hover{ transform: translateY(-2px); }
  .rune-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:4px; }
  .rune-btn-face{
    display:flex;
    align-items:center;
    justify-content:center;
    height:clamp(130px, 27dvh, 196px);
    background: linear-gradient(175deg, #f7edda, #efddbc);
    border:2px solid #8a1620;
    border-radius:3px;
    box-shadow: inset 0 0 0 1px rgba(58,38,20,0.15);
  }
  .rune-btn .rune-label{
    writing-mode: vertical-rl;
    text-orientation: upright;
    font-family: var(--serif);
    font-weight:800;
    font-size:clamp(18px, 4.2dvh, 25px);
    letter-spacing:0.25em;
    color:#8a1620;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* --- Question step --- */
  .question-card{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    padding:18px 18px;
    text-align:center;
  }
  .question-card .asker{
    font-size:11px;
    color: var(--ink-faint);
    letter-spacing:0.08em;
    margin-bottom:12px;
  }
  .question-card .qtext{
    font-family: var(--serif);
    font-size:17.5px;
    line-height:1.6;
    color: var(--ink);
    margin-bottom:22px;
    text-wrap: balance;
  }
  .answer-row{ display:flex; gap:10px; }
  .answer-btn{
    flex:1;
    padding:15px 10px;
    border-radius:12px;
    border:1px solid var(--line-strong);
    background: var(--surface-2);
    color: var(--ink);
    font-family: var(--sans);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition: border-color .15s ease, transform .15s ease, background .15s ease;
  }
  .answer-btn:hover{ border-color: var(--accent); background: var(--surface-3); transform: translateY(-1px); }
  .answer-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .reroll{
    display:block;
    margin:16px auto 0;
    background:none;
    border:none;
    color: var(--ink-faint);
    font-size:12px;
    text-decoration: underline;
    text-underline-offset:3px;
    cursor:pointer;
  }

  .spin-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:180px;
    gap:16px;
  }
  .spin-ring{
    width:96px; height:96px;
    border-radius:50%;
    border:1px dashed var(--line-strong);
    position:relative;
  }
  .spin-ring::before{
    content:"";
    position:absolute; inset:-1px;
    border-radius:50%;
    border-top:1px solid var(--gold);
    animation: spin 1s linear infinite;
  }
  .spin-label{ font-size:12px; color: var(--ink-faint); letter-spacing:0.14em; }


  .result{
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .result[hidden]{ display:none; }

  /* --- 星空×稲妻の外枠 + 和紙のお告げカード --- */
  .omikuji-frame{
    position:relative;
    width:100%;
    border-radius:12px;
    padding:clamp(18px, 3.5dvh, 30px) 12px clamp(10px, 2dvh, 16px);
    overflow:hidden;
    background:
      /* faint speckle */
      radial-gradient(1.4px 1.4px at 12% 20%, rgba(220,240,255,0.55), transparent 60%),
      radial-gradient(1.2px 1.2px at 82% 14%, rgba(220,240,255,0.5), transparent 60%),
      radial-gradient(1.3px 1.3px at 90% 68%, rgba(220,240,255,0.45), transparent 60%),
      radial-gradient(1.2px 1.2px at 15% 82%, rgba(220,240,255,0.5), transparent 60%),
      radial-gradient(1.1px 1.1px at 62% 88%, rgba(220,240,255,0.4), transparent 60%),
      /* electric burst */
      radial-gradient(circle at 50% 45%, rgba(210,240,255,0.9) 0%, rgba(120,195,245,0.55) 10%, rgba(50,120,190,0.28) 24%, transparent 46%),
      /* base */
      radial-gradient(circle at 50% 45%, #123055 0%, #0a1c38 42%, #050d1e 78%, #030812 100%);
    box-shadow: 0 26px 48px -22px rgba(0,0,0,0.75), inset 0 0 0 1px rgba(255,255,255,0.08);
  }
  .omikuji-bolt{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    filter: drop-shadow(0 0 7px rgba(150,215,255,0.65));
    pointer-events:none;
  }
  .omikuji-corner{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #f6e7ae, var(--gold) 60%, var(--gold-soft) 100%);
    box-shadow: 0 0 0 2px rgba(15,8,35,0.5), 0 0 6px rgba(255,224,150,0.55);
  }
  .omikuji-corner.tl{ top:8px; left:8px; }
  .omikuji-corner.tr{ top:8px; right:8px; }
  .omikuji-corner.bl{ bottom:8px; left:8px; }
  .omikuji-corner.br{ bottom:8px; right:8px; }


  .omikuji-card{
    position:relative;
    background: linear-gradient(175deg, #f7edda, #efddbc);
    border-radius:6px;
    padding:clamp(16px, 3dvh, 28px) 16px clamp(14px, 2.6dvh, 22px);
    box-shadow: 0 10px 26px -12px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(58,38,20,0.18);
  }
  .omikuji-card::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(58,38,20,0.32);
    pointer-events:none;
  }

  .omikuji-header{
    text-align:center;
    font-family: var(--serif);
    font-weight:700;
    font-size:clamp(13px, 2.4dvh, 15px);
    letter-spacing:0.5em;
    color:#3a2614;
    padding-bottom:clamp(7px, 1.4dvh, 11px);
    margin-bottom:clamp(10px, 2dvh, 18px);
    border-bottom:1px solid rgba(58,38,20,0.3);
  }

  .omikuji-flavor{
    font-family: var(--serif);
    font-size:clamp(14.5px, 2.6dvh, 16.5px);
    line-height:1.7;
    text-align:center;
    color: var(--accent);
    font-weight:700;
    margin-top:clamp(10px, 2dvh, 20px);
  }

  .omikuji-rule{
    width:56px; height:1px;
    background: rgba(58,38,20,0.28);
    margin: 20px auto 18px;
  }

  .omikuji-seal-row{
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .omikuji-seal{
    width:clamp(82px, 16dvh, 112px); height:clamp(82px, 16dvh, 112px);
    border-radius:50%;
    border:2.5px solid var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
  }
  .omikuji-seal::before{
    content:"";
    position:absolute; inset:6px;
    border:1px solid var(--accent);
    border-radius:50%;
    opacity:0.5;
  }
  .omikuji-seal span{
    font-family: var(--serif);
    font-weight:800;
    font-size:clamp(36px, 7dvh, 50px);
    color: var(--accent);
  }

  .verdict-actions{
    display:flex;
    gap:10px;
    margin-top:clamp(2px, 0.6dvh, 6px);
  }
  .verdict-actions button{
    font-family: var(--sans);
    font-size:13px;
    font-weight:700;
    padding:8px 16px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
  }
  .verdict-actions button.hit{ border-color: var(--good); color: var(--good); }
  .verdict-actions button.miss{ border-color: var(--bad); color: var(--bad); }
  .verdict-actions button:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }

  .again{
    margin-top:clamp(6px, 1.2dvh, 14px);
    background:none;
    border:none;
    color: var(--ink-faint);
    font-size:12px;
    text-decoration: underline;
    text-underline-offset:3px;
    cursor:pointer;
  }

  /* --- Log tab --- */
  .stat-grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
  }
  .stat-tile{
    background: var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px 10px;
    text-align:center;
  }
  .stat-tile .label{ font-size:10.5px; color: var(--ink-faint); letter-spacing:0.03em; }
  .stat-tile .value{
    font-family: var(--serif);
    font-size:22px;
    font-weight:700;
    color: var(--gold);
    margin-top:4px;
    font-variant-numeric: tabular-nums;
  }
  .stat-tile .value small{ font-size:11px; color: var(--ink-dim); font-family: var(--sans); font-weight:500; }

  .log-section-title{
    font-size:11px;
    color: var(--ink-faint);
    letter-spacing:0.06em;
    margin: 18px 0 8px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .log-section-title::after{ content:""; flex:1; height:1px; background: var(--line); }

  .log-list{ display:flex; flex-direction:column; gap:1px; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  .log-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    background: var(--surface-2);
    font-size:13px;
  }
  .log-row .time{ color: var(--ink-faint); font-variant-numeric: tabular-nums; width:52px; flex-shrink:0; }
  .log-row .choice{ font-family: var(--serif); font-weight:700; width:20px; }
  .log-row .persona-tag{ color: var(--ink-faint); font-size:11px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{
    font-size:11px;
    font-weight:700;
    padding:3px 9px;
    border-radius:999px;
  }
  .badge.hit{ color: var(--good); background: var(--good-bg); }
  .badge.miss{ color: var(--bad); background: var(--bad-bg); }
  .badge.sample{ color: var(--ink-faint); background: var(--surface-3); }

  .empty-state{
    text-align:center;
    padding: 28px 12px;
    color: var(--ink-faint);
    font-size:13px;
    border:1px dashed var(--line);
    border-radius:12px;
  }

  .sample-note{
    font-size:11px;
    color: var(--ink-faint);
    margin: 4px 0 8px;
  }

  footer.note{
    padding:clamp(8px, 1.6dvh, 14px) 18px clamp(10px, 1.8dvh, 18px);
    border-top:1px solid var(--line);
    font-size:clamp(9.5px, 1.8dvh, 10.5px);
    color: var(--ink-faint);
    line-height:1.5;
    flex-shrink:0;
  }
  footer.note a{color:var(--gold-soft)}

  @media (prefers-reduced-motion: reduce){
    .spin-ring::before{ animation:none; }
    .ember{ animation:none; opacity:0; }
    .rune-btn::before{ animation:none; }
    .tap-hint{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

<div class="stage">
 <div class="phone-frame">
  <div class="phone" id="phone">
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="mk" viewBox="0 0 60 96">
        <g transform="translate(30,48)">
          <g transform="translate(0,-34) rotate(-8)" fill="none" stroke="#2f7cf6" stroke-width="4" stroke-linecap="round">
            <path d="M -26 6 A 26 10 0 0 0 26 6"></path>
            <line x1="-26" y1="0" x2="-26" y2="6"></line>
            <line x1="26" y1="0" x2="26" y2="6"></line>
            <ellipse rx="26" ry="10"></ellipse>
          </g>
          <g fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round">
            <ellipse rx="22" ry="8"></ellipse>
            <line x1="-22" y1="0" x2="-22" y2="4.6"></line>

        "生駒「『{a}』なんだ。誰かのためにも、右だ。」",
        "生駒「『{a}』か。焔の向こうに行くなら、右だ。」",
        "生駒「『{a}』、これでいい。右で決める。」",
        "生駒「『{a}』か。ツラヌキ筒は仕込んである。右で仕掛ける。」",
        "生駒「『{a}』なんだ。甲鉄城のみんなを守る、右で。」",
        "生駒「『{a}』か。顕金駅で誓ったことを忘れない。右だ。」",
        "生駒「『{a}』、脱出行はまだ終わってない。右で行く。」",
        "生駒「『{a}』か。克城には気をつけろ、右で構える。」",
        "生駒「『{a}』なんだね。金剛郭まではまだ遠い。右だ。」",
        "生駒「『{a}』か。蒸気の圧は十分だ。右で行こう。」",
        "生駒「『{a}』、駅を守れなかった分まで。右だ。」"
      ]
    }
  };

  var root = document.documentElement;
  var persona = "mumei";
  var currentQuestion = null;
  var currentAnswer = null;
  var drawBtn = document.getElementById("drawBtn");
  var idleView = document.getElementById("idleView");
  var questionView = document.getElementById("questionView");
  var spinningView = document.getElementById("spinningView");
  var resultView = document.getElementById("resultView");
  var askerLabel = document.getElementById("askerLabel");
  var questionText = document.getElementById("questionText");
  var answerABtn = document.getElementById("answerABtn");
  var answerBBtn = document.getElementById("answerBBtn");
  var rerollBtn = document.getElementById("rerollBtn");
  var pickText = document.getElementById("pickText");
  var flavorText = document.getElementById("flavorText");
  var hitBtn = document.getElementById("hitBtn");
  var missBtn = document.getElementById("missBtn");
  var againBtn = document.getElementById("againBtn");
  var todayLine = document.getElementById("todayLine");

  var STORE_KEY = "mumei-oracle-log-v1";
  var pendingEntry = null;

  function loadLog(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveLog(entries){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(entries)); }catch(e){}
  }

  function todayKey(){
    var d = new Date();
    return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  }

  function pick(list){ return list[Math.floor(Math.random()*list.length)]; }

  // persona chips
  document.querySelectorAll(".persona-chip").forEach(function(chip){
    chip.addEventListener("click", function(){
      persona = chip.getAttribute("data-persona");
      document.querySelectorAll(".persona-chip").forEach(function(c){
        c.setAttribute("aria-pressed", c === chip ? "true" : "false");
      });
      root.setAttribute("data-persona", persona);
    });
  });


  // tabs
  var tabOracle = document.getElementById("tab-oracle");
  var tabLog = document.getElementById("tab-log");
  var panelOracle = document.getElementById("panel-oracle");
  var panelLog = document.getElementById("panel-log");
  function selectTab(which){
    var oracleOn = which === "oracle";
    tabOracle.setAttribute("aria-selected", oracleOn);
    tabLog.setAttribute("aria-selected", !oracleOn);
    panelOracle.hidden = !oracleOn;
    panelLog.hidden = oracleOn;
    if(!oracleOn) renderLog();
  }
  tabOracle.addEventListener("click", function(){ selectTab("oracle"); });
  tabLog.addEventListener("click", function(){ selectTab("log"); });

  function spawnEmbers(){
    var phone = document.getElementById("phone");
    for(var i=0;i<5;i++){
      var e = document.createElement("div");
      e.className = "ember";
      var size = 2 + Math.random()*3;
      e.style.width = size+"px";
      e.style.height = size+"px";
      e.style.left = (20 + Math.random()*60) + "%";
      e.style.bottom = "160px";
      e.style.animationDelay = (Math.random()*0.6)+"s";
      phone.appendChild(e);
      (function(el){ setTimeout(function(){ el.remove(); }, 7200); })(e);
    }
  }

  // シャッフルバッグ方式: 全問を引き切るまで同じ質問を出さない。
  // 母数が少なくても近接回での重複を体感的にゼロにできる。
  var questionBag = [];
  var lastQuestion = null;

  function shuffle(arr){
    var a = arr.slice();
    for(var i=a.length-1;i>0;i--){
      var j = Math.floor(Math.random()*(i+1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function nextQuestion(){
    if(questionBag.length === 0){
      questionBag = shuffle(LIFE_QUESTIONS);
      // バッグの継ぎ目でも直前と同じ質問が来ないようにする
      if(lastQuestion && questionBag[0] === lastQuestion && questionBag.length > 1){
        var idx = 1 + Math.floor(Math.random()*(questionBag.length-1));
        var tmp = questionBag[0]; questionBag[0] = questionBag[idx]; questionBag[idx] = tmp;
      }
    }
    var q = questionBag.shift();
    lastQuestion = q;
    return q;
  }

  function renderQuestion(){
    askerLabel.textContent = FLAVORS[persona].askerLabel;
    questionText.textContent = currentQuestion.q;
    answerABtn.textContent = currentQuestion.a;
    answerBBtn.textContent = currentQuestion.b;
  }

  function showQuestion(){
    currentQuestion = nextQuestion();
    renderQuestion();
    idleView.style.display = "none";
    resultView.hidden = true;
    questionView.hidden = false;
  }

  function chooseAnswer(answerLabel){
    currentAnswer = answerLabel;
    questionView.hidden = true;
    spinningView.hidden = false;
    spawnEmbers();
    setTimeout(function(){
      var side = Math.random() < 0.5 ? "中" : "右";
      var pool = FLAVORS[persona][side];
      var template = pick(pool);
      var line = template.replace("{a}", currentAnswer);

      pickText.textContent = side;
      flavorText.textContent = line;

      pendingEntry = {
        ts: Date.now(),
        choice: side,
        persona: persona,
        question: currentQuestion.q,
        answer: currentAnswer
      };

      spinningView.hidden = true;
      resultView.hidden = false;
    }, 1000);
  }

  function finishEntry(result){
    if(!pendingEntry) return;
    var entries = loadLog();
    entries.unshift({
      ts: pendingEntry.ts,
      choice: pendingEntry.choice,
      persona: pendingEntry.persona,
      question: pendingEntry.question,
      answer: pendingEntry.answer,
      result: result
    });
    saveLog(entries);
    pendingEntry = null;
    updateTodayLine();
    resetToIdle();
  }

  function resetToIdle(){
    resultView.hidden = true;
    questionView.hidden = true;
    spinningView.hidden = true;
    idleView.style.display = "";
  }

  drawBtn.addEventListener("click", showQuestion);
  answerABtn.addEventListener("click", function(){ chooseAnswer(currentQuestion.a); });
  answerBBtn.addEventListener("click", function(){ chooseAnswer(currentQuestion.b); });
  rerollBtn.addEventListener("click", showQuestion);
  hitBtn.addEventListener("click", function(){ finishEntry("hit"); });
  missBtn.addEventListener("click", function(){ finishEntry("miss"); });
  againBtn.addEventListener("click", showQuestion);
  var backHomeBtn = document.getElementById("backHomeBtn");
  backHomeBtn.addEventListener("click", resetToIdle);

  function updateTodayLine(){
    var entries = loadLog();
    var tk = todayKey();
    var todays = entries.filter(function(e){
      var d = new Date(e.ts);
      return (d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()) === tk;
    });
    var hits = todays.filter(function(e){ return e.result === "hit"; }).length;
    var pct = todays.length ? Math.round(hits/todays.length*100) : null;
    todayLine.innerHTML = "本日 <b>"+hits+"</b>/<b>"+todays.length+"</b> 的中（<b>"+(pct===null?"—":pct)+"</b>%）";
  }

  function fmtTime(ts){
    var d = new Date(ts);
    function pad(n){ return (n<10?"0":"")+n; }
    return pad(d.getHours())+":"+pad(d.getMinutes());
  }

  function rowHtml(entry, isSample){
    var badgeClass = isSample ? "sample" : (entry.result === "hit" ? "hit" : "miss");
    var badgeText = isSample ? "サンプル" : (entry.result === "hit" ? "当たり" : "外れ");
    var answerLabel = entry.answer ? "「"+entry.answer+"」" : "—";
    return '<div class="log-row">'
      + '<span class="time">'+fmtTime(entry.ts)+'</span>'
      + '<span class="choice">'+entry.choice+'</span>'
      + '<span class="persona-tag">'+answerLabel+'の答え</span>'
      + '<span class="badge '+badgeClass+'">'+badgeText+'</span>'
      + '</div>';
  }

  var SAMPLE = [
    { ts: Date.now() - 1000*60*24, choice: "右", persona: "ikoma", question: "今日はツイてる予感があるか？", answer: "ある", result: "hit" },
    { ts: Date.now() - 1000*60*95, choice: "中", persona: "mumei", question: "朝ごはんは食べてきたか？", answer: "食べてない", result: "miss" },
    { ts: Date.now() - 1000*60*210, choice: "中", persona: "mumei", question: "今朝は早起きだったか？", answer: "早起き", result: "hit" }
  ];

  function renderLog(){
    var entries = loadLog();

    // stats
    var tk = todayKey();
    var todays = entries.filter(function(e){
      var d = new Date(e.ts);
      return (d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()) === tk;
    });
    var todayHits = todays.filter(function(e){ return e.result==="hit"; }).length;
    document.getElementById("statToday").innerHTML = todayHits + "<small> /" + todays.length + "</small>";

    var streak = 0;
    for(var i=0;i<entries.length;i++){
      if(entries[i].result === "hit") streak++; else break;
    }
    document.getElementById("statStreak").textContent = streak;

    var totalHits = entries.filter(function(e){ return e.result==="hit"; }).length;
    document.getElementById("statTotal").textContent = entries.length ? Math.round(totalHits/entries.length*100)+"%" : "—";

    // real log
    var wrap = document.getElementById("realLogWrap");
    if(entries.length === 0){
      wrap.innerHTML = '<div class="empty-state">まだ記録がありません。「おみくじをひく」タブで結果を記録してみましょう。</div>';
    } else {
      wrap.innerHTML = '<div class="log-list">' + entries.slice(0,20).map(function(e){ return rowHtml(e, false); }).join("") + '</div>';
    }

    // sample log
    document.getElementById("sampleLog").innerHTML = SAMPLE.map(function(e){ return rowHtml(e, true); }).join("");
  }

  updateTodayLine();
})();
</script>
