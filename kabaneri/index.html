<body>
<div>
  <h1>新しいURLに移転しました</h1>
  <p>まもなく自動で移動します。移動しない場合は下のボタンを押してください。<br>
     ホーム画面に追加している場合は、追加し直してください。</p>
  <a href="/kabaneri-unato/">minnanoslot.com/kabaneri-unato/ を開く</a>

<script>
// 旧URLで登録されたサービスワーカーとキャッシュを片づけてから移動する。
// 残しておくと、ホーム画面から起動したときに古い画面が出続ける。
(function () {
  var go = function () { location.replace('/kabaneri-unato/'); };
  if (!('serviceWorker' in navigator)) { setTimeout(go, 300); return; }

  Promise.all([
    navigator.serviceWorker.getRegistrations()
      .then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }),
    caches.keys()
      .then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
  ]).catch(function () {}).then(go);
})();
</script>
