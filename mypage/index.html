<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>実戦履歴｜みんなのスロット</title>
<style>
  :root{
    --bg:#fdfdfd; --ink:#26262a; --ink-2:#5c6270; --ink-3:#8d94a3;
    --line:#e6e9ef; --accent:#2f7cf6; --accent-soft:#e4efff; --panel:#f6f8fb;
    --red:#e2453c; --green:#1f9d57; --blue:#2f7cf6; --gold:#b8860b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.75;-webkit-text-size-adjust:100%;
  }
  .wrap{max-width:720px;margin:0 auto;padding:26px 18px 90px}

  header.top{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  header.top .site{flex:1;min-width:0}
  header.top .site a{font-size:11.5px;color:var(--ink-3);text-decoration:none;letter-spacing:.08em}
  header.top h1{font-size:20px;margin:2px 0 0;letter-spacing:.01em}
  .who{font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.6}
  .who b{display:block;color:var(--ink-2);font-size:12px;word-break:break-all}
  .lnk{background:none;border:0;color:var(--accent);font-family:inherit;font-size:11.5px;cursor:pointer;padding:2px 0}

  /* ログイン */
  .gate{max-width:400px;margin:40px auto;text-align:left}
  .gate h2{font-size:19px;margin:0 0 8px}
  .gate p{font-size:13.5px;color:var(--ink-2);margin:0 0 16px}
  .gate input{
    width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;
    padding:13px;font-size:16px;font-family:inherit;color:var(--ink);margin-bottom:10px;
  }
  .gate input:focus{outline:none;border-color:var(--accent)}
  .btn{
    width:100%;background:var(--accent);border:1px solid var(--accent);color:#fff;
    border-radius:11px;padding:13px;font-size:15px;font-weight:700;
    font-family:inherit;cursor:pointer;
  }
  .btn[disabled]{opacity:.55}
  .ok{
    background:var(--accent-soft);border-radius:11px;padding:14px 16px;
    font-size:13.5px;line-height:1.9;
  }

  /* 集計 */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 15px}
  .tile .k{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.03em}
  .tile .v{font-size:24px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums;line-height:1.25}
  .tile .v em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:2px;font-weight:700}
  .tile .sub{font-size:11px;color:var(--ink-3);margin-top:2px}
  .tile.mine .v{color:var(--accent)}

  h2.sec{
    font-size:14px;margin:30px 0 12px;padding-top:18px;
    border-top:1px solid var(--line);letter-spacing:.02em;
  }
  h2.sec span{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:8px}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border-bottom:1px solid var(--line);padding:9px 6px;text-align:right;font-variant-numeric:tabular-nums}
  th{color:var(--ink-3);font-size:11px;font-weight:700;text-align:right;white-space:nowrap}
  th:first-child,td:first-child{text-align:left}
  td.dim{color:var(--ink-3)}

  /* 実戦の一覧 */
  .rec{
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
    background:#fff;
  }
  .rec .hd{display:flex;align-items:center;gap:10px;cursor:pointer}
  .rec .d{font-size:12px;color:var(--ink-3);flex:0 0 auto}
  .rec .g{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;flex:1}
  .rec .g em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400;margin-left:4px}
  .tag{
    font-size:10.5px;font-weight:800;border-radius:999px;padding:3px 9px;flex:0 0 auto;
    background:var(--panel);color:var(--ink-2);border:1px solid var(--line);
  }
  .tag.s6{background:#ffe9e9;color:#c1272d;border-color:#f7c7c7}
  .tag.s5{background:#ffefdc;color:#b26b00;border-color:#f5d9b0}
  .tag.s4{background:#fff8d6;color:#8a6d00;border-color:#efe1a4}
  .tag.s3{background:#e6f6ec;color:#1f7a44;border-color:#c2e6d1}
  .tag.s2{background:#e7f0ff;color:#2456a6;border-color:#c6d9f7}
  .tag.s1{background:#eef0f4;color:#5c6270;border-color:#dde1e8}
  .rec .body{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
  .rec.open .body{display:block}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
  .kv .k{color:var(--ink-3)}
  .kv .v{font-variant-numeric:tabular-nums}
  .memo{
    margin-top:9px;background:var(--panel);border-radius:9px;padding:9px 11px;
    font-size:12.5px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
  }
  .memo b{display:block;font-size:10.5px;color:var(--ink-3);margin-bottom:2px}

  .msg{font-size:13px;color:var(--ink-3);padding:18px 2px}
  .foot{margin-top:40px;font-size:11.5px;color:var(--ink-3)}
  .foot a{color:var(--ink-3)}
  a{color:var(--accent)}
</style>

<div class="wrap">

<header class="top">
  <div class="site">
    <a href="/">みんなのスロット</a>
    <h1>実戦履歴</h1>
  </div>
  <div class="who" id="who" hidden>
    <b id="whoemail">—</b>
    <button class="lnk" id="logout">ログアウト</button>
  </div>
</header>

<!-- ログインしていないとき -->
<div class="gate" id="gate" hidden>
  <h2>ログイン</h2>
  <p>カウンターで参加したメールアドレスを入れてください。届いたリンクを押すと、預けた実戦の記録が見られます。</p>
  <input type="email" id="email" inputmode="email" autocomplete="email"
         autocapitalize="off" spellcheck="false" placeholder="you@example.com">
  <button class="btn" id="send">ログイン用のリンクを送る</button>
  <p style="margin-top:14px"><a href="/kabaneri-unato/">カウンターを開く</a></p>
</div>

<div class="gate" id="sent" hidden>
  <h2>メールを送りました</h2>
  <div class="ok"><b id="sentaddr">—</b> にリンクを送りました。<br>そのリンクを押すと、この画面に戻ってきます。</div>
  <p style="margin-top:14px">30分で使えなくなります。届かないときは迷惑メールをご確認ください。</p>
</div>

<div id="app" hidden></div>
<div class="msg" id="msg" hidden>読み込んでいます…</div>

<p class="foot" id="foot" hidden>
  記録の追加・削除は<a href="/kabaneri-unato/">カウンター</a>から。
  ／ <a href="/privacy.html">個人情報の扱いについて</a>
</p>
</div>

<script>
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n || 0).toLocaleString('ja-JP');
const AVG = ['red', 'green'];                       // 発光率と平均ptは無名・生駒だけ
const NAME = { red: '無名', green: '生駒', blue: '銅藍' };
const NO_PT = 1, GLOW_PT = 15, HI_PT = 15;
const STEP = 15, BUCKETS = 10;

const show = (id, on) => { $(id).hidden = !on; };
function msg(t){ $('msg').textContent = t; show('msg', !!t); }

/* ---------- ログイン ---------- */

async function boot(){
  const q = new URLSearchParams(location.search).get('login');
  if (q) history.replaceState(null, '', location.pathname);

  msg('読み込んでいます…');
  let user = null;
  try {
    const r = await fetch('/api/auth/me', { credentials: 'same-origin' });
    user = (await r.json()).user;
  } catch(e) {}

  if (!user) {
    msg('');
    show('gate', true);
    if (q && q !== 'ok') {
      msg({ expired: 'リンクの有効期限が切れています', used: 'このリンクは使用済みです',
            invalid: 'リンクが正しくありません' }[q] || 'ログインできませんでした');
    }
    return;
  }

  $('whoemail').textContent = user.email;
  show('who', true);
  await load();
}

$('send').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if (!/^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/.test(email)) { msg('メールアドレスを確認してください'); return; }
  $('send').disabled = true; $('send').textContent = '送信中…';
  try {
    const r = await fetch('/api/auth/request', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' },
      // 戻り先をこのページにする。指定しないとカウンターに戻ってしまう
      body: JSON.stringify({ email, next: '/mypage/' }),
    });
    const j = await r.json();
    if (!j.ok) { msg(j.error || '送信できませんでした'); return; }
    $('sentaddr').textContent = email;
    show('gate', false); show('sent', true); msg('');
  } catch(e) { msg('通信できませんでした'); }
  finally { $('send').disabled = false; $('send').textContent = 'ログイン用のリンクを送る'; }
});

$('logout').addEventListener('click', async () => {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'same-origin' }).catch(() => {});
  location.reload();
});

/* ---------- 集計 ---------- */

/* その当選までに最後まで消化した周期の数。
   周期到達で当たったならその周期は最後まで進んでいるので N。
   CZや天井で当たったなら途中で終わっていて抽選を受けていないので N-1。
   カウンター側と必ず同じ数え方にすること */
const doneCycles = (w) => (w.via === 'cycle' ? w.cycle : w.cycle - 1);

function summarize(records){
  let games = 0, bell = 0, no = 0, glow = 0, hi = 0, cz = 0;
  const pts = [];
  const dist = new Array(BUCKETS + 1).fill(0);
  const wins = [];

  for (const r of records) {
    games += r.games || 0;
    bell += r.bell || 0;
    for (const id of AVG) {
      const c = (r.chars || {})[id];
      if (!c) continue;
      no += c.no || 0; glow += c.glow || 0; hi += c.hi || 0; cz += c.cz || 0;
    }
    for (const p of r.czPointsBy || []) {
      if (!AVG.includes(p.c)) continue;
      pts.push(p.pt);
      dist[Math.min(Math.floor(p.pt / STEP), BUCKETS)]++;
    }
    for (const w of r.wins || []) wins.push(w);
  }

  const appear = no + glow;
  return {
    n: records.length, games, bell, no, glow, hi, cz, pts, dist, wins,
    glowRate: appear ? glow / appear * 100 : null,
    avgPt: pts.length ? pts.reduce((a, b) => a + b, 0) / pts.length : null,
    bellRate: (bell && games) ? games / bell : null,
  };
}

function cycleTable(wins){
  const known = wins.filter(w => w.cycle);
  if (!known.length) return '';
  let html = '<table><thead><tr><th>周期</th><th>到達</th><th>当選</th><th>当選率</th></tr></thead><tbody>';
  for (let n = 1; n <= 6; n++) {
    const reached = known.filter(w => doneCycles(w) >= n).length;
    const hit = known.filter(w => w.via === 'cycle' && w.cycle === n).length;
    html += `<tr><td>${n}周期</td><td>${fmt(reached)}</td><td>${fmt(hit)}</td>` +
            `<td class="${reached ? '' : 'dim'}">${reached ? (hit / reached * 100).toFixed(1) + '%' : '—'}</td></tr>`;
  }
  return html + '</tbody></table>' +
    '<p class="msg" style="padding:8px 2px">到達は、その周期を最後まで消化した回数です。CZや天井で当たった周期は途中で終わっていて抽選を受けていないので数えません。</p>';
}

function distTable(dist, total){
  if (!total) return '';
  let html = '<table><thead><tr><th>規定pt</th><th>件数</th><th>割合</th></tr></thead><tbody>';
  for (let i = 0; i <= BUCKETS; i++) {
    const label = i === 0 ? '15pt未満' : i === BUCKETS ? '150pt以上' : `${i * STEP}〜`;
    html += `<tr><td>${label}</td><td>${fmt(dist[i])}</td>` +
            `<td>${(dist[i] / total * 100).toFixed(1)}%</td></tr>`;
  }
  return html + '</tbody></table>';
}

function recordRow(r){
  const d = new Date(r.date);
  const date = `${d.getMonth() + 1}/${d.getDate()}`;
  const set = r.setting ? `設定${r.setting}` : '設定不明';
  const cls = r.setting ? `s${r.setting}` : '';
  const s = summarize([r]);
  return `<div class="rec" data-id="${r.id}">
    <div class="hd">
      <span class="d">${date}</span>
      <span class="g">${fmt(r.games)}G<em>下段ベル ${fmt(r.bell)}</em></span>
      <span class="tag ${cls}">${set}</span>
    </div>
    <div class="body">
      <div class="kv">
        <span class="k">発光率</span><span class="v">${s.glowRate == null ? '—' : s.glowRate.toFixed(1) + '%'}（非発光${fmt(s.no)} / 発光${fmt(s.glow)}）</span>
        <span class="k">平均pt/CZ</span><span class="v">${s.avgPt == null ? '—' : s.avgPt.toFixed(2)}（CZ ${fmt(s.pts.length)}回）</span>
        <span class="k">高確発光など</span><span class="v">${fmt(s.hi)}</span>
        <span class="k">当選</span><span class="v">${fmt((r.wins || []).length)}件</span>
      </div>
      ${r.memo ? `<div class="memo"><b>メモ</b>${r.memo.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>` : ''}
    </div>
  </div>`;
}

async function load(){
  msg('読み込んでいます…');
  let j, all = null;
  try {
    const r = await fetch('/api/myrecords?machine=kabaneri-unato', { credentials: 'same-origin' });
    j = await r.json();
  } catch(e) { msg('通信できませんでした'); return; }
  if (!j.ok) { msg(j.error || '読み込めませんでした'); return; }

  // みんなの中央値。並べて出すと、自分の値が高いのか低いのかが分かる
  try {
    const r = await fetch('/api/stats?machine=kabaneri-unato');
    all = await r.json();
  } catch(e) {}

  msg('');
  show('foot', true);

  if (!j.records.length) {
    $('app').innerHTML = '<div class="msg">まだ預けた実戦がありません。カウンターで数えて保存すると、ここに出ます。</div>';
    show('app', true);
    return;
  }

  const s = summarize(j.records);
  const cmp = (mine, med, unit, digits) => {
    if (mine == null) return '<div class="sub">—</div>';
    if (med == null) return '<div class="sub">みんな —</div>';
    const diff = mine - med;
    const sign = diff >= 0 ? '+' : '';
    return `<div class="sub">みんな ${med.toFixed(digits)}${unit}（${sign}${diff.toFixed(digits)}）</div>`;
  };

  $('app').innerHTML = `
    <div class="tiles">
      <div class="tile"><div class="k">実戦</div><div class="v">${fmt(s.n)}<em>件</em></div></div>
      <div class="tile"><div class="k">総ゲーム数</div><div class="v">${fmt(s.games)}<em>G</em></div></div>
      <div class="tile mine"><div class="k">発光率</div>
        <div class="v">${s.glowRate == null ? '—' : s.glowRate.toFixed(1)}<em>%</em></div>
        ${cmp(s.glowRate, all && all.glowRateMedian, '%', 1)}</div>
      <div class="tile mine"><div class="k">平均 pt/CZ</div>
        <div class="v">${s.avgPt == null ? '—' : s.avgPt.toFixed(2)}</div>
        ${cmp(s.avgPt, all && all.avgPtMedian, '', 2)}</div>
      <div class="tile"><div class="k">下段ベル</div>
        <div class="v">${s.bellRate == null ? '—' : '1/' + s.bellRate.toFixed(1)}</div>
        <div class="sub">${fmt(s.bell)}回</div></div>
      <div class="tile"><div class="k">CZ突入</div><div class="v">${fmt(s.cz)}<em>回</em></div>
        <div class="sub">無名・生駒</div></div>
    </div>

    ${s.wins.length ? `<h2 class="sec">周期当選率<span>全実戦の合算</span></h2>${cycleTable(s.wins)}` : ''}
    ${s.pts.length ? `<h2 class="sec">CZ突入時のポイント分布<span>${fmt(s.pts.length)}件</span></h2>${distTable(s.dist, s.pts.length)}` : ''}

    <h2 class="sec">実戦${j.truncated ? '<span>新しい500件まで</span>' : ''}</h2>
    ${j.records.map(recordRow).join('')}
  `;
  show('app', true);

  $('app').addEventListener('click', (e) => {
    const rec = e.target.closest('.rec');
    if (rec) rec.classList.toggle('open');
  });
}

boot();
</script>
