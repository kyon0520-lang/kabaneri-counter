name: X読み取りテスト（使い捨て）

on:
  workflow_dispatch:   # 手動実行のみ。疎通確認用

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Playwright を入れる
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: X (sloneko222) を読んでみる
        run: python3 matsuwaru/x_test_scrape.py
