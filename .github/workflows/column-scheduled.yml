name: COLUMN予約公開

# 公開日が来た「予約公開ブランチ」を main に取り込んで、本番に出す。
# ブランチ名は scheduled/YYYY-MM-DD-<slug>（例：scheduled/2026-09-29-toho-event-units）。
# 公開したい変更（記事・一覧・トップ・sitemap・TODO）を丸ごとそのブランチにコミットして push しておくと、
# その日付の朝にここで main へマージ → push → デプロイする。ブランチは取り込んだあと消す。
# ブランチの中身は main に入るまで本番には出ない（まつわる更新は main だけをデプロイするため）。

on:
  schedule:
    # 08:47 JST。まつわる更新（09:17）より前に済ませる。毎時00分は混むので外す
    - cron: '47 23 * * *'
  workflow_dispatch:          # 手動実行も可（公開日が来ているブランチだけ取り込む）

permissions:
  contents: write

concurrency:
  group: column-scheduled
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 公開日が来たブランチを取り込む
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          today=$(TZ=Asia/Tokyo date +%Y-%m-%d)
          echo "今日（JST）: $today"
          due=""
          for b in $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/scheduled/'); do
            name=${b#origin/}
            d=${name#scheduled/}; d=${d:0:10}
            if [[ "$d" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && ! "$d" > "$today" ]]; then
              due="$due $name"
            fi
          done
          if [ -z "$due" ]; then
            echo "公開日が来たブランチはない"
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # まつわる更新の push と重なったときのために、取り込み〜push を3回まで試す
          for try in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            ok=1
            for name in $due; do
              echo "取り込み: $name"
              if ! git merge --no-ff --no-edit "origin/$name" -m "予約公開: $name"; then
                git merge --abort || true
                echo "::error::$name が main と衝突した。手で直す必要がある"
                exit 1
              fi
            done
            if git push origin HEAD:main; then ok=0; break; fi
            echo "push が弾かれた。取り直してやり直す（$try 回目）"
            sleep 20
          done
          if [ "$ok" != "0" ]; then echo "::error::push できなかった"; exit 1; fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "branches=$due" >> "$GITHUB_OUTPUT"

      # 本番反映。リポジトリ直下から実行する（別ディレクトリからだと本番が壊れる）
      - name: Cloudflare Pages へデプロイ
        if: steps.merge.outputs.released == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=kabaneri-counter --branch=main

      - name: 取り込んだブランチを消す
        if: steps.merge.outputs.released == 'true'
        run: |
          for name in ${{ steps.merge.outputs.branches }}; do
            git push origin --delete "$name" || true
          done
