name: まつわる更新

on:
  schedule:
    # ブログの更新は7〜8時台が多いが前後するため、拾えるまで3回試す。
    # 新着がなければ何もせず終わるので、二重に取り込むことはない。
    # 毎時00分はGitHub側が最も混み、数時間ずれたり発火しないことがあるので必ず外す。
    - cron: '17 0 * * *'     # 毎日 09:17 JST
    - cron: '37 1 * * *'     # 毎日 10:37 JST
    - cron: '23 4 * * *'     # 毎日 13:23 JST（取りこぼしの保険）
    # 「明日は何の日」タブを翌日ぶんに更新するためだけの実行。ブログの新着チェックは
    # 上の3回で十分なので、ここでは行わない（下の「新着を取り込む」で分岐させている）。
    - cron: '0 10 * * *'     # 毎日 19:00 JST
  workflow_dispatch:          # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 検索用の読み（人参→にんじん）を作るのに使う。入らなくても取り込みは進む
      - name: 読み変換を入れる
        continue-on-error: true   # 入らなくても既存の読みで動く。ここで日次更新を止めない
        run: pip install -r matsuwaru/requirements.txt

      # 新着記事の取得〜名寄せまで。異常時は失敗通知が飛ぶ
      # stores.json に定義された全店舗をまわす。1店舗が失敗しても他店舗の取り込み・
      # 後段のコミットは止めない（1店舗のブログ更新停止が他店舗を巻き込まないように）
      # 19:00 JST（「明日は何の日」専用の実行）はブログの新着チェックが目的ではないので飛ばす
      - name: 新着を取り込む
        if: github.event.schedule != '0 10 * * *'
        working-directory: matsuwaru
        run: |
          ids=$(python3 -c "import json;print(' '.join(s['id'] for s in json.load(open('stores.json'))['stores'] if not s.get('paused')))")
          fail=0
          for id in $ids; do
            echo "::group::$id"
            python3 sync.py "$id" || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" = "1" ]; then exit 1; fi

      # ページの再生成（「明日は何の日」の更新もここに含まれる）。
      # 前段が一部店舗の失敗で失敗していても、正常な店舗の分は取りこぼさず反映する
      - name: ページを再生成する
        if: ${{ !cancelled() }}
        working-directory: matsuwaru
        run: python3 src/build-pages.py

      # 手動実行のときだけ認証情報を確認する（本番には触らない読み取り専用コマンド）
      - name: Cloudflare 接続確認
        if: github.event_name == 'workflow_dispatch'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project list

      # 前段（新着を取り込む）が一部店舗の失敗で exit 1 していても、
      # 他店舗分の正常な更新は取りこぼさずコミットする
      - name: 変更をコミット
        id: commit
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet -- matsuwaru; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "新着なし。コミットもデプロイもしない"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add matsuwaru
            git commit -m "まつわるデータ更新 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 本番反映。リポジトリ直下から実行する（別ディレクトリからだと本番が壊れる）
      - name: Cloudflare Pages へデプロイ
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=kabaneri-counter --branch=main
