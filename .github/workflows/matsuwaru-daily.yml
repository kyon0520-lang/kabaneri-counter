name: まつわる更新

on:
  schedule:
    - cron: '0 1 * * *'      # 毎日 10:00 JST（ブログ更新は7〜8時台）
  workflow_dispatch:          # 手動実行も可

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 新着記事の取得〜名寄せまで。異常時はここで落ちて失敗通知が飛ぶ
      - name: 新着を取り込む
        working-directory: matsuwaru
        run: python3 sync.py

      - name: 変更をコミット
        id: commit
        run: |
          if git diff --quiet -- matsuwaru/raw.json matsuwaru/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "新着なし。コミットもデプロイもしない"
          else
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add matsuwaru/raw.json matsuwaru/data
            git commit -m "まつわるデータ更新 $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 本番反映。リポジトリ直下から実行する（別ディレクトリからだと本番が壊れる）
      - name: Cloudflare Pages へデプロイ
        if: steps.commit.outputs.changed == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=kabaneri-counter --branch=main
