<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="robots" content="noindex, nofollow">
<title>ゾーン当選率カウンター</title>
<style>
:root{
  --gothic:"Hiragino Sans","Hiragino Kaku Gothic ProN",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;
  --bg:#121212; --panel:#1b1b1b; --ink:#ececec; --sub:#9b9b9b;
  --line:#2e2e2e; --accent:#7ba7e8; --hit:#4aa52e; --self:#d9902a; --miss:#9b9b9b; --danger:#ef6a5e;
  --hit-bg:#18270f; --self-bg:#2b1a08; --miss-bg:#262626;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--gothic);line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 60px)}
body.hasbar .wrap{padding-bottom:calc(env(safe-area-inset-bottom) + 110px)}
h1{font-size:17px;margin:0 0 14px;letter-spacing:.02em}
h2{font-size:13px;margin:18px 0 8px;color:var(--sub);font-weight:700}
select,input,button{font:inherit;color:inherit}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
button{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;cursor:pointer}
button:active{transform:scale(.97)}
button:disabled{opacity:.35;cursor:default}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar select{flex:1}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.tabs button{padding:11px 0;font-weight:700;color:var(--sub)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#10151d}
.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}
.gin{display:flex;align-items:baseline;justify-content:center;flex-wrap:wrap;gap:8px}
.gin input{width:160px;flex:0 0 auto;text-align:center;font-size:56px;font-weight:700;padding:0;background:transparent;border:0;border-radius:0}
.gin input::placeholder{color:#444}
.gin input:focus{outline:none;box-shadow:0 3px 0 var(--accent)}
.gin input::-webkit-outer-spin-button,.gin input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.gin input[type=number]{-moz-appearance:textfield}
.gunit{font-size:24px;font-weight:700;color:var(--sub)}
.gprompt{flex-basis:100%;text-align:center;font-size:12px;color:var(--sub);line-height:1.4;margin-top:2px}
.target{text-align:center;margin:10px 0 14px;font-size:15px;color:var(--sub)}
.target b{color:var(--accent);font-size:18px}
.target.ng b{color:var(--danger)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{padding:20px 0;font-size:16px;font-weight:700;border:0}
.hit{background:var(--hit-bg);color:var(--hit)} .miss{background:var(--miss-bg);color:var(--miss)} .self{background:var(--self-bg);color:var(--self)}
#convs{margin-top:12px}
.cv{position:relative}
.cv .cvh{padding-right:30px}
.xbtn{background:none;border:0;color:var(--sub);padding:0;width:26px;height:26px;border-radius:13px;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center}
.cv .xbtn{position:absolute;top:10px;right:10px}
.bell .xbtn{flex:0 0 26px}
.cvh{display:flex;justify-content:space-between;align-items:baseline}
.cvn{font-size:14px;font-weight:700}
.cvp{font-size:26px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.cvs{font-size:11px;color:var(--sub);margin:2px 0 8px;font-variant-numeric:tabular-nums}
.cvb{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px}
.cvb button{padding:13px 0;font-size:15px;font-weight:700;border:0}
.cvb .cvu{background:var(--miss-bg);color:var(--sub);font-size:14px}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(18,18,18,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:9px 16px calc(9px + env(safe-area-inset-bottom))}
.bellg{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 6px;max-width:680px}
.bellg span{font-size:11px;color:var(--sub)}
.bellg input{width:100px;height:30px;border-radius:9px;padding:0 6px;font-size:16px;text-align:center;font-variant-numeric:tabular-nums;border-color:#e0b24a66}
.bellg input::-webkit-outer-spin-button,.bellg input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
#roles{max-width:680px;margin:0 auto;max-height:174px;overflow-y:auto}
.bell{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.bell:last-child{margin-bottom:0}
.bell .mode{flex:0 0 auto;display:flex}
.bell .mode button{height:42px;width:34px;padding:0;font-size:17px;color:var(--sub);border-radius:10px 0 0 10px}
.bell .mode.r button{border-radius:0 10px 10px 0}
.bell .mode button.on{background:var(--accent);border-color:var(--accent);color:#10151d}
.bell .rbtn{flex:1;min-width:0;height:42px;border-radius:0;padding:0 8px;border-color:#e0b24a88;display:flex;align-items:center;justify-content:center;gap:10px}
.bell .rbtn .lbl{font-size:12px;color:#e8c06a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bell .rbtn .num{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.bell .rbtn.minus{border-color:#e2453c88}
.bell .rbtn.minus .num{color:#ff8078}
.bell .rate{flex:0 0 66px;text-align:right;font-size:16px;font-weight:700;color:#e8c06a;line-height:1.15;font-variant-numeric:tabular-nums}
.bell .rate em{display:block;font-style:normal;font-size:9px;font-weight:400;color:var(--sub)}
.msg{min-height:20px;font-size:12px;color:var(--sub);text-align:center;margin-top:10px}
.msg.err{color:var(--danger)}
.gauge{display:flex;gap:3px;margin:16px 0 0}
.gauge .gz{flex:1;min-width:0}
.gauge .gz i{display:block;height:10px;border-radius:5px;background:#262626}
.gauge .gz.past i{background:var(--accent)}
.gauge .gz.now i{background:var(--hit)}
.gauge .gz em{float:right;font-style:normal}
.gauge .gz span{display:block;font-size:10px;color:var(--sub);margin-top:3px;font-variant-numeric:tabular-nums}
.gauge .gz.now span{color:var(--ink);font-weight:700}
.last{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--sub);padding:0 4px}
.last button{background:none;border:0;padding:6px 8px;font-size:12px;font-weight:700;color:var(--accent)}
.last button:disabled{color:var(--sub)}
.hrow{display:flex;gap:12px;padding:0 0 14px}
.hrow:last-child{padding-bottom:0}
.hln{display:flex;flex-direction:column;align-items:center;flex:0 0 12px}
.hdot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:0 0 auto}
.hdot.zone{background:var(--hit)} .hdot.self{background:var(--self)}
.hln i{flex:1;width:2px;background:var(--line);margin-top:4px}
.hrow:last-child .hln i{display:none}
.hmain{flex:1;min-width:0}
.hmain .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.hmain .t span{font-size:12px;font-weight:400;color:var(--sub);margin-left:8px}
.hmain input.memo{width:100%;margin-top:2px;padding:4px 6px;margin-left:-6px;font-size:13px;color:var(--sub);background:transparent;border:1px solid transparent;border-radius:8px}
.hmain input.memo:focus{background:var(--bg);border-color:var(--line);color:var(--ink);outline:none}
.hmain input.memo::placeholder{color:#5f7893}
.hrow .x{align-self:flex-start;padding:4px 10px;font-size:12px;color:var(--sub);background:none;border:0}
.rings{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 6px}
.ring{text-align:center}
.ring svg{width:100%;max-width:132px;display:block;margin:0 auto}
.rz{font-size:12px;font-weight:700;margin-top:2px}
.rn{font-size:10px;color:var(--sub);font-variant-numeric:tabular-nums}
.distwrap{overflow-x:auto}
table.dist{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12px}
table.dist th:nth-child(1), table.dist td:nth-child(1){width:84px}
table.dist th:nth-child(3), table.dist td:nth-child(3){width:64px}
table.dist th,table.dist td{border:1px solid var(--line);padding:7px 4px;text-align:center}
table.dist th{background:rgba(123,167,232,.14);font-size:11px;font-weight:600;white-space:nowrap}
table.dist td.zn{font-weight:700;white-space:nowrap}
table.dist td.cnt{font-variant-numeric:tabular-nums;white-space:nowrap}
table.dist tr.has td{background:rgba(123,167,232,.06)}
td.dbar{padding:4px 6px}
.barwrap{display:flex;align-items:center;gap:6px}
.bartrack{flex:1;min-width:0;height:14px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.05)}
.barfill{height:14px;border-radius:3px;background:var(--accent)}
.barpct{flex:0 0 44px;text-align:right;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.st{font-size:11px;color:var(--sub);margin-top:8px;line-height:1.6}
.hh{display:flex;justify-content:space-between;align-items:center}
.more{background:none;border:0;padding:4px 0 4px 12px;font-size:12px;font-weight:700;color:var(--accent)}
.empty{color:var(--sub);font-size:14px;text-align:center;padding:24px 0}
.erow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.erow input{flex:1;width:0;text-align:center}
.erow span{color:var(--sub);white-space:nowrap}
.erow.range{justify-content:center;margin-bottom:6px}
.erow.range input{flex:0 0 72px}
.erow.range .sep{margin:0 8px}
.danger{color:var(--danger)}
.iconbtn{flex:0 0 46px;width:46px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.menu{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
body.menuopen{overflow:hidden}
.mwrap{max-width:680px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 40px)}
.mhead{display:flex;align-items:center;justify-content:space-between;height:44px;margin-bottom:10px}
.mhead .mt{font-size:17px;font-weight:700}
.mhead button{width:40px;height:40px;padding:0;border-radius:20px;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--sub)}
.mhead button.invis{visibility:hidden}
.mlabel{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.06em;margin:22px 6px 8px}
.mgroup{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.mgroup.pad{padding:14px}
.mrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px;text-align:left;font-size:15px}
.mrow:last-child{border-bottom:0}
.mrow:active{background:#222;transform:none}
.mrow .mname{flex:1}
.mrow .ms{color:var(--sub);font-size:13px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .ch{color:var(--sub);font-size:18px;line-height:1}
.mrow.add{color:var(--accent);font-weight:700}
.mrow.danger{color:var(--danger)}
.mdesc{font-size:12px;color:var(--sub);margin:0 6px 12px;line-height:1.7}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>ゾーン当選率カウンター</h1>
  <div class="bar">
    <select id="machine" aria-label="機種"></select>
    <button id="menuBtn" class="iconbtn" aria-label="メニュー"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14"/></svg></button>
  </div>

  <div id="body" class="hidden">
    <div class="tabs">
      <button id="tabCount" class="on">カウント</button>
      <button id="tabRate">ゾーン当選率</button>
    </div>

    <section id="viewCount">
      <div class="card">
        <div class="gin">
          <input id="g" type="number" inputmode="numeric" min="0" step="1" placeholder="0" aria-label="現在のG数">
          <span class="gunit">G</span>
          <span class="gprompt">現在のG数を入力してください</span>
        </div>
        <div class="gauge" id="gauge"></div>
        <div class="target" id="target"></div>
        <div class="btns" id="kinds">
          <button class="hit" data-k="zone">ゾーン当選</button>
          <button class="self" data-k="self">自力当選</button>
        </div>
        <div id="pending" class="hidden">
          <div class="target" id="pendingTitle"></div>
          <div class="tagpick" id="tagPick"></div>
          <input id="memoIn" type="text" maxlength="60" placeholder="メモ(任意)" style="width:100%;margin-bottom:10px">
          <div class="btns">
            <button id="cancel" class="miss">キャンセル</button>
            <button id="confirm" class="hit">履歴に追加</button>
          </div>
        </div>
        <div class="msg" id="msg"></div>
      </div>
      <div class="last"><span id="last"></span><button id="undo">↩ 戻す</button></div>
      <div id="convs"></div>
    </section>

    <section id="viewRate" class="hidden">
      <h2>ゾーン当選率</h2>
      <div class="card" id="rates"></div>
      <h2 class="hh"><span>当選履歴</span><button id="histMore" class="more hidden"></button></h2>
      <div class="card" id="history"></div>
    </section>

  </div>
  <div id="none" class="empty">「＋機種」で機種を追加してください</div>
</div>
<div class="menu hidden" id="menu" role="dialog" aria-modal="true" aria-label="メニュー">
 <div class="mwrap">
  <div class="mhead"><button id="menuBack" aria-label="戻る">‹</button><span class="mt" id="menuTitle">メニュー</span><button id="menuClose" aria-label="閉じる">✕</button></div>

  <div class="mpage" data-page="root">
    <div class="mgroup"><button class="mrow add" id="addMachine"><span class="mname">＋ 機種を追加</span></button></div>
    <div id="mrootm">
      <div class="mlabel">この機種の設定</div>
      <div class="mgroup">
        <button class="mrow" data-go="name"><span class="mname">機種名</span><span class="ms" id="ms-name"></span><span class="ch">›</span></button>
        <button class="mrow" data-go="zones"><span class="mname">ゾーン</span><span class="ms" id="ms-zones"></span><span class="ch">›</span></button>
        <button class="mrow" data-go="tags"><span class="mname">当選契機</span><span class="ms" id="ms-tags"></span><span class="ch">›</span></button>
        <button class="mrow" data-go="convs"><span class="mname">カウントカード</span><span class="ms" id="ms-convs"></span><span class="ch">›</span></button>
        <button class="mrow" data-go="roles"><span class="mname">小役カウンター</span><span class="ms" id="ms-roles"></span><span class="ch">›</span></button>
      </div>
      <div class="mlabel">データ</div>
      <div class="mgroup">
        <button class="mrow danger" id="reset"><span class="mname">記録をすべてリセット</span></button>
        <button class="mrow danger" id="delMachine"><span class="mname">この機種を削除</span></button>
      </div>
    </div>
  </div>

  <div class="mpage hidden" data-page="name">
    <div class="mgroup pad"><div class="erow" style="margin:0"><input id="machineName" placeholder="機種名" maxlength="40" style="text-align:left"></div></div>
  </div>

  <div class="mpage hidden" data-page="zones">
    <p class="mdesc">G数を入れると、どのゾーンに入るかを自動で判定します。範囲は「数字の何G前から何G後まで」で決まります。</p>
    <div class="mgroup pad">
      <div class="mlabel" style="margin:0 0 8px">範囲(ゾーンの数字を基準に)</div>
      <div class="erow range"><span>前</span><input id="beforeIn" type="number" inputmode="numeric" min="0"><span>G</span><span class="sep">〜</span><span>後</span><input id="afterIn" type="number" inputmode="numeric" min="0"><span>G</span></div>
      <div class="mlabel" style="margin:14px 0 8px">ゾーン</div>
      <div id="zoneEdit"></div>
      <div class="erow" style="margin:0"><button id="addZone" style="flex:1">＋ゾーンを追加</button></div>
    </div>
  </div>

  <div class="mpage hidden" data-page="tags">
    <p class="mdesc">当選を記録するときに選べる候補です。</p>
    <div class="mgroup pad">
      <div id="tagEdit"></div>
      <div class="erow" style="margin:0"><button id="addTag" style="flex:1">＋当選契機を追加</button></div>
    </div>
  </div>

  <div class="mpage hidden" data-page="convs">
    <p class="mdesc">当選・非当選を数えて、率を出すカードです。カウント画面に並びます。</p>
    <div class="mgroup pad">
      <div id="convEdit"></div>
      <div class="erow" style="margin:0"><button id="addConv" style="flex:1">＋カードを追加</button></div>
    </div>
  </div>

  <div class="mpage hidden" data-page="roles">
    <p class="mdesc">画面下で回数と確率(1/○○)を数える小役です。確率は「現在のG数」をもとに計算します。</p>
    <div class="mgroup pad">
      <div id="roleEdit"></div>
      <div class="erow" style="margin:0"><button id="addRole" style="flex:1">＋小役を追加</button></div>
    </div>
  </div>
 </div>
</div>
<div class="dock hidden" id="bellbar">
  <div class="bellg"><span>現在のG数</span><input type="number" id="bellg" inputmode="numeric" min="0" max="99999" step="1" placeholder="0" aria-label="現在のG数"></div>
  <div id="roles"></div>
</div>
<script>
(function(){
  var KEY = 'zoneCounter.v2';
  var KINDS = { zone: 'ゾーン当選', self: '自力当選' };
  var state = load();
  var tab = 'count';
  var HIST_MAX = 5;
  var histAll = false;
  var pending = null; // { g, kind } 備考入力待ちの当選

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function load(){
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.machines)){
        // 旧バージョンの「非当選」記録は廃止(通過は当選位置から自動計算)
        s.machines.forEach(function(m){
          m.trials = m.trials.filter(function(t){ return t.kind !== 'miss'; });
          if (!Array.isArray(m.tags)) m.tags = [];
          if (!m.convs){
            var oc = m.counters || { rare: [], weak: [] };
            m.convs = [{ id: uid() + 'r', label: 'レア役変換', seq: oc.rare || [] }, { id: uid() + 'w', label: '弱リコリス目高確', seq: oc.weak || [] }];
          }
          delete m.counters;
          if (!m.roles){
            var ob = m.bell || { n: 0, g: 0 };
            m.roles = [{ id: uid() + 'b', label: '共通ベル', n: ob.n || 0 }];
            m.totalG = ob.g || 0;
          }
          if (m.totalG == null) m.totalG = 0;
          delete m.bell;
          if (m.win !== 2){ m.before = 0; m.after = 70; m.win = 2; }   // 100なら100〜170
          m.zones.forEach(function(z){ if (z.at == null) z.at = z.from || 0; });
        });
        if (s.machines.length) return s;
      }
    } catch(e){}
    var m0 = { id: uid(), name: 'リコリス・リコイル', zones: defaultZones([100, 250, 400, 600, 750, 850]), before: 0, after: 70, win: 2, tags: ['ノーマルCZ', '幼少期CZ', '直撃'], convs: [{ id: uid() + 'r', label: 'レア役変換', seq: [] }, { id: uid() + 'w', label: '弱リコリス目高確', seq: [] }], roles: [{ id: uid() + 'b', label: '共通ベル', n: 0 }], totalG: 0, trials: [] };
    return { machines: [m0], currentId: m0.id };
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
  function cur(){
    for (var i = 0; i < state.machines.length; i++) if (state.machines[i].id === state.currentId) return state.machines[i];
    return state.machines[0] || null;
  }
  function defaultZones(list){
    return (list || [100, 200, 300]).map(function(at){ return { id: uid() + at, at: at }; });
  }
  function zoneLabel(z){ return z.at + 'Gゾーン'; }
  // ゾーンは「その数字の before G前 〜 after G後」(例: 100Gゾーン = 100〜170G。両端を含む)
  function zFrom(m, z){ return Math.max(0, z.at - m.before); }
  function zTo(m, z){ return z.at + m.after + 1; }   // 終了(含まない側の値)
  function zoneOf(m, g){
    for (var i = 0; i < m.zones.length; i++){

  function renderRates(m){
    var self = m.trials.filter(function(t){ return t.kind === 'self'; }).length;
    var stats = m.zones.map(function(z){
      // ゾーン当選の位置より手前のゾーンは、当たらず通過した(非当選)として数える
      var w = 0, x = 0;
      m.trials.forEach(function(t){
        // 自力当選は、当たったゾーン自体は数えず、手前のゾーンだけ非当選にする
        if (t.kind === 'zone' && zoneOf(m, t.g) === z) w++;
        else if (zTo(m, z) <= t.g) x++;
      });
      var n = w + x;
      return { z: z, w: w, n: n, pct: n ? w / n * 100 : null };
    });
    if (!stats.length){ $('rates').innerHTML = '<div class="empty">設定でゾーンを追加してください</div>'; return; }
    var best = Math.max.apply(null, stats.map(function(r){ return r.pct || 0; }));
    var C = 2 * Math.PI * 40;
    $('rates').innerHTML = '<div class="rings">' + stats.map(function(r){
      var has = r.pct !== null;
      var col = has && best > 0 && r.pct === best ? 'var(--hit)' : 'var(--accent)';
      return '<div class="ring"><svg viewBox="0 0 100 100" role="img" aria-label="' + zoneLabel(r.z) + ' ' + (has ? r.pct.toFixed(1) + '%' : '未集計') + '">' +
        '<circle cx="50" cy="50" r="40" fill="none" stroke="#262626" stroke-width="9"/>' +
        (has && r.pct > 0 ? '<circle cx="50" cy="50" r="40" fill="none" stroke="' + col + '" stroke-width="9" stroke-linecap="round" stroke-dasharray="' +
          (C * r.pct / 100).toFixed(1) + ' ' + C.toFixed(1) + '" transform="rotate(-90 50 50)"/>' : '') +
        '<text x="50" y="58" text-anchor="middle" font-size="' + (has ? (r.pct >= 100 ? 15 : 19) : 22) + '" font-weight="700" fill="' + (has ? 'var(--ink)' : 'var(--sub)') + '">' +
        (has ? r.pct.toFixed(1) + '%' : '--') + '</text></svg>' +
        '<div class="rz">' + zoneLabel(r.z) + '</div><div class="rn">当選 ' + r.w + ' / 通過 ' + r.n + '</div></div>';
    }).join('') + '</div>' +
      '<div class="st">自力当選 ' + self + ' 回(当たったゾーンは数えず、手前のゾーンのみ非当選)</div>';
  }

  });

  $('zoneEdit').addEventListener('click', function(e){
    var b = e.target.closest('button[data-dz]'); if (!b) return;
    var m = cur();
    m.zones = m.zones.filter(function(z){ return z.id !== b.dataset.dz; });
    save(); render();
  });

  $('reset').addEventListener('click', function(){
    var m = cur(); if (!m) return;
    if (confirm('「' + m.name + '」の記録をすべて消しますか?')){ m.trials = []; m.convs.forEach(function(c){ c.seq = []; }); m.roles.forEach(function(r){ r.n = 0; }); m.totalG = 0; closeMenu(); save(); render(); }
  });

  $('delMachine').addEventListener('click', function(){
    var m = cur(); if (!m) return;
    if (!confirm('「' + m.name + '」を削除しますか?記録も消えます。')) return;
    state.machines = state.machines.filter(function(x){ return x.id !== m.id; });
    state.currentId = state.machines[0] ? state.machines[0].id : null;
    resetSigs();
    closeMenu();
    save(); render();
  });

  render();
})();
</script>
</body>
</html>
