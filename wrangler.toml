# Cloudflare Pages の設定。functions/ を動かすための D1 の結び付けをここでする。
# これが無いと env.DB が空になり、送信が 503 になる。

name = "kabaneri-counter"
compatibility_date = "2026-08-10"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "minnanoslot"
database_id = "4b46155d-c2fe-41b4-8ee0-72d0b5fbf7db"

# 本番以外のブランチにデプロイしたとき（試用URL）にも同じDBを使う。
# Pages はブランチごとに preview 環境になり、ここが無いと env.DB が空になる。
[[env.preview.d1_databases]]
binding = "DB"
database_name = "minnanoslot"
database_id = "4b46155d-c2fe-41b4-8ee0-72d0b5fbf7db"

[[env.production.d1_databases]]
binding = "DB"
database_name = "minnanoslot"
database_id = "4b46155d-c2fe-41b4-8ee0-72d0b5fbf7db"

[env.preview.vars]
# ドメイン認証をする前でも送れる、Resend が用意している差出人。
# ただし届く先は Resend に登録した本人のアドレスだけ。
# ほかの人に届けるには minnanoslot.com のDNS認証（SPF/DKIM）が要る。
MAIL_FROM = "みんなのスロット <onboarding@resend.dev>"
