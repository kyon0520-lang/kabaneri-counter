# Cloudflare Pages の設定。functions/ を動かすための D1 の結び付けをここでする。
# これが無いと env.DB が空になり、送信が 503 になる。

name = "kabaneri-counter"
compatibility_date = "2026-08-10"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "minnanoslot"
database_id = "4b46155d-c2fe-41b4-8ee0-72d0b5fbf7db"

# 本番以外のブランチにデプロイしたとき（試用URL）にも同じDBを使う。
# Pages はブランチごとに preview 環境になり、ここが無いと env.DB が空になる。
[[env.preview.d1_databases]]
binding = "DB"
database_name = "minnanoslot"
database_id = "4b46155d-c2fe-41b4-8ee0-72d0b5fbf7db"

[[env.production.d1_databases]]
binding = "DB"
database_name = "minnanoslot"
database_id = "4b46155d-c2fe-41b4-8ee0-72d0b5fbf7db"

# リワード広告ゲートのプライベートモード対策用（TODO.md「プライベートモード対策」参照）。
# IPアドレス等から作る一時的な識別子を expirationTtl=24時間 で保管し、24時間で自動的に消す。
# D1ではなくKVにしたのはこの自動失効のため（D1だと手動の掃除処理が要る）。
[[kv_namespaces]]
binding = "ADGATE_KV"
id = "dca2ae900883497396b527798d986338"

[[env.preview.kv_namespaces]]
binding = "ADGATE_KV"
id = "dca2ae900883497396b527798d986338"

[[env.production.kv_namespaces]]
binding = "ADGATE_KV"
id = "dca2ae900883497396b527798d986338"

# 送信ドメインは send.minnanoslot.com（2026-08-26 にResendで認証済み）。
# ルートではなくサブドメインにしてあるのは、ルートのSPFを
# Cloudflare Email Routing（info@ の受信）が使っているため。
# 同じ名前にSPFを2本置くと規格違反で両方壊れる。
[env.preview.vars]
MAIL_FROM = "みんなのスロット <login@send.minnanoslot.com>"

[env.production.vars]
MAIL_FROM = "みんなのスロット <login@send.minnanoslot.com>"
